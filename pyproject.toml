[project]
name = "keuangan-cli"
version = "0.1.0"
description = "Mini tool CLI untuk bot-keuangan-telegram — catat dan cek keuangan dari terminal, database yang sama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.51",
    "greenlet>=3.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.22.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]
